<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 03 — All 7 Themes</title>
    <link rel="stylesheet" href="../dist/style.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 8px; }
        .desc { color: #8b949e; margin-bottom: 24px; }
        .theme-block { margin-bottom: 28px; }
        .theme-label {
            display: inline-block; background: #21262d; color: #f0883e;
            padding: 4px 12px; border-radius: 6px 6px 0 0;
            font-size: 0.85rem; font-weight: 600;
        }
        .back { color: #58a6ff; text-decoration: none; font-size: 0.9rem; }
        .back:hover { text-decoration: underline; }
        #results { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 24px; }
        .pass { color: #3fb950; } .fail { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Back to Demo Hub</a>
        <h1>Demo 03: All 7 Themes</h1>
        <p class="desc">Showcasing the same JavaScript code across all 7 built-in themes side by side — verifying CSS Variables and theme isolation.</p>

        <div id="theme-container"></div>

        <div id="results"><strong>🧪 Test Results:</strong><br></div>
    </div>

    <script src="../dist/hideko-code-block.umd.js"></script>

    <script>
        const themes = ['dark', 'light', 'dracula', 'one-dark', 'nord', 'monokai', 'github-dark'];
        const sampleCode = `// Fibonacci Generator
function* fibonacci(limit = Infinity) {
    let [a, b] = [0, 1];
    while (a < limit) {
        yield a;
        [a, b] = [b, a + b];
    }
}

const fib = fibonacci(1000);
for (const num of fib) {
    console.log(\`Fibonacci: \${num}\`);
}

// Arrow function with destructuring
const processData = ({ name, scores = [] }) => {
    const avg = scores.reduce((sum, s) => sum + s, 0) / scores.length;
    return { name, average: avg.toFixed(2) };
};`;

        const container = document.getElementById('theme-container');
        themes.forEach(theme => {
            const block = document.createElement('div');
            block.className = 'theme-block';
            block.innerHTML = `
                <span class="theme-label">🎨 ${theme}</span>
                <pre data-theme="${theme}"><code class="language-javascript">${sampleCode.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
            `;
            container.appendChild(block);
        });

        // Run highlightAll
        const results = document.getElementById('results');
        function assert(name, condition) {
            const icon = condition ? '✅' : '❌';
            const cls = condition ? 'pass' : 'fail';
            results.innerHTML += `<span class="${cls}">${icon} ${name}</span><br>`;
        }

        const highlighter = window.HidekoCodeBlock || window.HidekoHighlight;
        highlighter.highlightAll('pre code', { basePath: '../dist/languages/' }).then(() => {
            const pres = document.querySelectorAll('pre[data-theme]');
            assert(`${pres.length} theme blocks rendered`, pres.length === 7);

            themes.forEach(theme => {
                const pre = document.querySelector(`pre[data-theme="${theme}"]`);
                const bg = getComputedStyle(pre).backgroundColor;
                assert(`Theme "${theme}" has background color`, bg && bg !== '' && bg !== 'rgba(0, 0, 0, 0)');
            });

            // Check that light theme has different bg than dark theme
            const darkPre = document.querySelector('pre[data-theme="dark"]');
            const lightPre = document.querySelector('pre[data-theme="light"]');
            const darkBg = getComputedStyle(darkPre).backgroundColor;
            const lightBg = getComputedStyle(lightPre).backgroundColor;
            assert('Dark and Light themes have different backgrounds', darkBg !== lightBg);
        });
    </script>
</body>
</html>
