<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 07 — Dynamic Inject</title>
    <link rel="stylesheet" href="../dist/style.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 8px; }
        .desc { color: #8b949e; margin-bottom: 24px; }
        .back { color: #58a6ff; text-decoration: none; font-size: 0.9rem; }
        .back:hover { text-decoration: underline; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
        .btn {
            background: #238636; color: #fff; border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .btn.secondary { background: #1f6feb; }
        .btn.secondary:hover { background: #388bfd; }
        .btn.danger { background: #da3633; }
        .btn.danger:hover { background: #f85149; }
        #dynamic-container { min-height: 100px; }
        .injected-label {
            display: inline-block; background: #f0883e33; color: #f0883e;
            padding: 2px 10px; border-radius: 4px; font-size: 0.75rem;
            margin-bottom: 4px;
        }
        .inject-block { margin-bottom: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #results { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 24px; }
        .pass { color: #3fb950; } .fail { color: #f85149; }
        #counter { color: #8b949e; margin-bottom: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Back to Demo Hub</a>
        <h1>Demo 07: Dynamic Inject</h1>
        <p class="desc">Simulating real-world scenarios (SPA / Chat Applications) — dynamically inject new code blocks into the DOM and highlight them on-the-fly.</p>

        <div class="btn-row">
            <button class="btn" onclick="injectCode('javascript')">➕ Add JavaScript</button>
            <button class="btn secondary" onclick="injectCode('python')">➕ Add Python</button>
            <button class="btn secondary" onclick="injectCode('sql')">➕ Add SQL</button>
            <button class="btn danger" onclick="clearAll()">🗑️ Clear All</button>
            <button class="btn" style="background:#6e40c9" onclick="runTests()">🧪 Run Tests</button>
        </div>

        <div id="counter">Injected blocks: 0</div>
        <div id="dynamic-container"></div>

        <div id="results"><strong>🧪 Test Results:</strong><br><span class="pass">Click an Add button above, then click Run Tests</span><br></div>
    </div>

    <script src="../dist/hideko-code-block.umd.js"></script>

    <script>
        const highlighter = window.HidekoCodeBlock || window.HidekoHighlight;
        const container = document.getElementById('dynamic-container');
        const counterEl = document.getElementById('counter');
        let injectCount = 0;

        const snippets = {
            javascript: `// Dynamic inject #${Date.now()}
const fetchData = async (url) => {
    try {
        const res = await fetch(url);
        const data = await res.json();
        return data.filter(item => item.active);
    } catch (err) {
        console.error('Fetch failed:', err.message);
        return [];
    }
};`,
            python: `# Dynamic inject #${Date.now()}
import pandas as pd

def analyze(df: pd.DataFrame) -> dict:
    """Analyze dataframe and return summary statistics."""
    summary = {
        'rows': len(df),
        'columns': list(df.columns),
        'mean': df.select_dtypes(include='number').mean().to_dict(),
        'nulls': df.isnull().sum().to_dict()
    }
    return summary`,
            sql: `-- Dynamic inject #${Date.now()}
WITH monthly_sales AS (
    SELECT
        DATE_TRUNC('month', sale_date) AS month,
        product_id,
        SUM(quantity * price) AS revenue
    FROM sales
    GROUP BY 1, 2
)
SELECT month, product_id, revenue,
    LAG(revenue) OVER (PARTITION BY product_id ORDER BY month) AS prev_month
FROM monthly_sales
ORDER BY month DESC;`
        };

        async function injectCode(lang) {
            injectCount++;
            const code = snippets[lang].replace(/#\d+/, `#${injectCount}`);

            const wrapper = document.createElement('div');
            wrapper.className = 'inject-block';
            wrapper.innerHTML = `
                <span class="injected-label">🔥 Dynamic #${injectCount} — ${lang}</span>
                <pre><code class="language-${lang}">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
            `;
            container.appendChild(wrapper);

            // Highlight the newly injected element
            const codeEl = wrapper.querySelector('pre code');
            await highlighter.highlightElement(codeEl, {
                theme: 'monokai',
                basePath: '../dist/languages/'
            });

            counterEl.textContent = `Injected blocks: ${injectCount}`;
        }

        function clearAll() {
            container.innerHTML = '';
            injectCount = 0;
            counterEl.textContent = 'Injected blocks: 0';
        }

        function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<strong>🧪 Test Results:</strong><br>';

            function assert(name, condition) {
                const icon = condition ? '✅' : '❌';
                const cls = condition ? 'pass' : 'fail';
                results.innerHTML += `<span class="${cls}">${icon} ${name}</span><br>`;
            }

            const blocks = container.querySelectorAll('.inject-block');
            assert(`${blocks.length} injected blocks detected`, blocks.length > 0);

            blocks.forEach((block, i) => {
                const code = block.querySelector('code');
                const hasTokens = code && code.innerHTML.includes('mtk');
                assert(`Block #${i + 1}: Syntax tokens highlighted`, hasTokens);
            });

            // Test double-processing prevention
            const processed = container.querySelectorAll('[data-hideko-processed="true"]');
            assert(`${processed.length} elements marked with data-hideko-processed`, processed.length === blocks.length);

            // Try re-highlighting — should NOT double-process
            const firstCode = container.querySelector('code');
            if (firstCode) {
                const htmlBefore = firstCode.innerHTML;
                highlighter.highlightElement(firstCode, { theme: 'monokai', basePath: '../dist/languages/' }).then(() => {
                    const htmlAfter = firstCode.innerHTML;
                    assert('Double-processing prevented (DOM preserved)', htmlBefore === htmlAfter);
                });
            }
        }
    </script>
</body>
</html>
