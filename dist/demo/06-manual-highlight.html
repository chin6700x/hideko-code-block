<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 06 — Manual Highlight API</title>
    <link rel="stylesheet" href="../style.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 8px; }
        .desc { color: #8b949e; margin-bottom: 24px; }
        .section { margin-bottom: 32px; }
        .section h2 { color: #3fb950; font-size: 1.1rem; margin-bottom: 12px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        .back { color: #58a6ff; text-decoration: none; font-size: 0.9rem; }
        .back:hover { text-decoration: underline; }
        #output-block {
            background: #1e1e1e; border: 1px solid #30363d; border-radius: 8px;
            padding: 16px; font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.9rem; line-height: 1.6; overflow-x: auto;
        }
        #raw-html-output {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 16px; font-family: monospace; font-size: 0.75rem;
            line-height: 1.5; overflow-x: auto; color: #8b949e; word-break: break-all;
            max-height: 200px; overflow-y: auto;
        }
        #results { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 24px; }
        .pass { color: #3fb950; } .fail { color: #f85149; }
        label { display: block; color: #8b949e; font-size: 0.85rem; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Back to Demo Hub</a>
        <h1>Demo 06: Manual Highlight API</h1>
        <p class="desc">Testing direct invocation of low-level <code>highlight()</code> API to convert code strings into HTML and inject manually into the DOM.</p>

        <div class="section">
            <h2>Rendered Result from highlight() API</h2>
            <label>Rendered Output:</label>
            <pre class="hideko-pre-block hideko-theme-block" data-theme="one-dark" id="output-block"><code id="output-code"></code></pre>
        </div>

        <div class="section">
            <h2>Raw HTML Output (Inspect generated markup)</h2>
            <div id="raw-html-output"></div>
        </div>

        <div id="results"><strong>🧪 Test Results:</strong><br></div>
    </div>

    <script src="../hideko-code-block.umd.js"></script>

    <script type="module">
        const results = document.getElementById('results');
        function assert(name, condition) {
            const icon = condition ? '✅' : '❌';
            const cls = condition ? 'pass' : 'fail';
            results.innerHTML += `<span class="${cls}">${icon} ${name}</span><br>`;
        }

        const codeString = `interface User {
    id: number;
    name: string;
    email: string;
    roles: Role[];
}

type Role = 'admin' | 'editor' | 'viewer';

async function fetchUsers(api: string): Promise<User[]> {
    const response = await fetch(api);
    if (!response.ok) {
        throw new Error(\`HTTP \${response.status}\`);
    }
    const data: User[] = await response.json();
    return data.filter(u => u.roles.includes('admin'));
}

// Usage
const admins = await fetchUsers('https://api.example.com/users');
console.log(\`Found \${admins.length} admin users\`);`;

        const highlighter = window.HidekoCodeBlock || window.HidekoHighlight;

        // Get registered language definition
        const langDef = highlighter.languageAliases;
        assert('languageAliases is available', typeof langDef === 'object');

        try {
            // Load and register TypeScript definition
            const tsMod = await import('../languages/typescript.js');
            highlighter.registerLanguage('typescript', tsMod.language);
            assert('registerLanguage("typescript") succeeded', true);

            // Use the low-level highlight() API
            const result = highlighter.highlight(codeString, 'typescript');

            assert('highlight() returned result object', typeof result === 'object');
            assert('result.html is a non-empty string', typeof result.html === 'string' && result.html.length > 0);

            // Inject into DOM
            document.getElementById('output-code').innerHTML = result.html;
            document.getElementById('raw-html-output').textContent = result.html.substring(0, 2000) + (result.html.length > 2000 ? '...' : '');

            assert('result.html contains <span> token tags', result.html.includes('<span'));
            assert('result.html contains mtk classes', result.html.includes('mtk'));
            assert('result.html contains mtk5 (keyword)', result.html.includes('mtk5'));
            assert('result.html contains mtk9 (type)', result.html.includes('mtk9'));
            assert('Output injected to DOM successfully', document.getElementById('output-code').innerHTML.length > 0);
        } catch (err) {
            assert('highlight() API call', false);
            console.error(err);
        }
    </script>
</body>
</html>
